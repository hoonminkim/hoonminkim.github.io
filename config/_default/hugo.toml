baseURL = "https://hoonminkim.github.io/"
title = "Hoonmin Kim"
theme = "blowfish"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableEmoji = true
summaryLength = 30
enableGitInfo = false
[pagination]
  pagerSize = 10
[outputs]
  home = ["HTML", "RSS", "JSON"]
[taxonomies]
  tag = "tags"
  category = "categories"
[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = false
